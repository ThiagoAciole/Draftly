name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Incremento da versão a publicar"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

jobs:
  prepare_release:
    name: Preparar versão
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restaurar cache do Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Instalar dependências
        run: npm ci

      - name: Configurar identidade do Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Atualizar versão, criar tag e enviar
        run: npm run release:${{ inputs.bump }}

      - name: Expor tag criada
        id: version
        run: |
          echo "tag=v$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Windows
    needs: prepare_release
    if: ${{ always() && (needs.prepare_release.result == 'success' || needs.prepare_release.result == 'skipped') }}
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare_release.outputs.tag || github.ref_name }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restaurar cache do Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Instalar dependências
        run: npm ci

      - name: Gerar aplicação Windows
        run: npm run tauri:build

      - name: Guardar executável portátil
        uses: actions/upload-artifact@v4
        with:
          name: draftly-windows-portable
          path: src-tauri/target/release/Draftly.exe
          if-no-files-found: error

      - name: Guardar instalador Windows
        uses: actions/upload-artifact@v4
        with:
          name: draftly-windows-setup
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  build-linux:
    name: Linux (.deb)
    needs: prepare_release
    if: ${{ always() && (needs.prepare_release.result == 'success' || needs.prepare_release.result == 'skipped') }}
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare_release.outputs.tag || github.ref_name }}

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restaurar cache do Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Instalar dependências
        run: npm ci

      - name: Gerar pacote Debian
        run: npm run tauri:build

      - name: Guardar pacote Debian
        uses: actions/upload-artifact@v4
        with:
          name: draftly-linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  release:
    name: Publicar release
    needs: [prepare_release, build-windows, build-linux]
    if: ${{ always() && needs.build-windows.result == 'success' && needs.build-linux.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare_release.outputs.tag || github.ref_name }}

      - name: Definir tag da release
        id: release-version
        env:
          RELEASE_TAG: ${{ needs.prepare_release.outputs.tag || github.ref_name }}
        run: |
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Baixar artefatos
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Criar release no GitHub
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release-version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Draftly ${{ steps.release-version.outputs.tag }}
          generate_release_notes: true
          files: |
            release-assets/**
            scripts/update-draftly-linux.sh
